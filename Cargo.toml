# Phase 2 workspace. Phase 1's `scripts/` and `src/bin/` are deliberately *not*
# cargo targets — they are source assets compiled inside each consuming app's own
# package (see CLAUDE.md), so nothing here references them.
[workspace]
members = ["crates/spend-core", "crates/mobile-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
